# Workspace root: not published itself. The distributions live in packages/ (core -> example-package,
# cli -> example-cli).
[tool.uv.workspace]
members = ["packages/core", "packages/cli"]

[tool.uv.sources]
example-package = { workspace = true }
example-cli = { workspace = true }

[dependency-groups]
dev = [
  "example-package",
  "example-cli",
  "mypy>=1.13",
  "pip-licenses>=5",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
src = [
  "packages/core/src",
  "packages/cli/src",
  "packages/core/tests",
  "packages/cli/tests",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["example_package", "example_cli"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "S603"]  # assert and subprocess are fine in tests
"scripts/**" = ["S603", "S607", "T201"]  # scripts call the trusted gh CLI and print progress

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "packages/core/src:packages/cli/src"
files = ["packages"]

[tool.pytest.ini_options]
addopts = "-m 'not integration' --strict-markers --cov=example_package --cov=example_cli --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: slower end-to-end tests, run in CI but not by default or in pre-commit"]

[tool.coverage.run]
branch = true
