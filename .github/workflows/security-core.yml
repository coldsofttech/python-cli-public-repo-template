name: Security core

# packages/core: static analysis (Semgrep). Called by security.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  core-semgrep:
    name: core semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Semgrep
        uses: ./.github/actions/semgrep
        with:
          path: packages/core
          configs: p/python p/owasp-top-ten
          category: semgrep-core
