name: Release core

# Tag vX.Y.Z: builds the core library (example-package) and uploads the distribution files. Publishing to PyPI
# (trusted publishing, no stored tokens) and attaching the files to the GitHub release happen in
# release.yml, because PyPI does not support trusted publishing from a reusable workflow. Called by
# release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  core-build:
    name: core build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Check the tag
        uses: ./.github/actions/check-release-tag
        with:
          package: example-package
          prefix: v
      - name: Build the package
        run: uv build --package example-package
      - name: Check the package metadata
        run: uvx twine check --strict dist/*
      - name: Upload the distribution files
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
