name: Security Docker

# packages/docker: the Dockerfile is checked by Semgrep and Trivy on every run. The built image is
# scanned for vulnerable OS and Python packages on the weekly and manual runs only, because it needs
# a full build. Findings go to the Security tab as SARIF. Called by security.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-semgrep:
    name: docker semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Semgrep
        uses: ./.github/actions/semgrep
        with:
          path: packages/docker
          configs: p/dockerfile
          category: semgrep-docker

  docker-trivy-config:
    name: docker trivy (dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Scan the Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: packages/docker
          # Trivy reads Dockerfile.dockerignore as a Dockerfile and fails on it
          skip-files: packages/docker/Dockerfile.dockerignore
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true # the SARIF report otherwise lists, and fails on, every severity
          format: sarif
          output: trivy-config.sarif
          exit-code: "1"
      - name: Upload results
        if: always() && hashFiles('trivy-config.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-docker-config

  docker-trivy-image:
    name: docker trivy (image)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/docker/Dockerfile
          load: true
          tags: example-cli:scan
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: example-cli:scan
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true # the SARIF report otherwise lists, and fails on, every severity
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
      - name: Upload results
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-docker-image
