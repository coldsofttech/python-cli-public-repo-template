name: CI

# Calls one workflow per package (ci-core, ci-cli, ci-docker), one for the rest of the repository
# (ci-repo) and ci-installer once the cli has passed; `ci` at the end is the single required check
# for the branch ruleset. On pull
# requests, `changes` limits the run to the parts of the repository the change can affect; every
# other event runs everything.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/ci-core.yml

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/ci-cli.yml

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/ci-docker.yml

  repo:
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    uses: ./.github/workflows/ci-repo.yml

  installer:
    needs: [changes, cli]
    if: needs.changes.outputs.installer == 'true' && !cancelled() && !failure()
    uses: ./.github/workflows/ci-installer.yml

  ci:
    if: always()
    needs: [changes, core, cli, docker, repo, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          # A job skipped because its part of the repository did not change counts as passed.
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
