name: CI Docker

# packages/docker: builds the command line image (packages/docker/Dockerfile) for linux/amd64 and
# runs the image tests (packages/docker/tests) against it: it starts, runs as an unprivileged user,
# keeps its folder and reports failures briefly. Nothing is published; release-docker.yml pushes the image
# to GHCR for a docker-vX.Y.Z release. See packages/docker/docs/docker.md. Called by ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-smoke:
    name: docker build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/docker/Dockerfile
          load: true
          tags: example-cli:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          sync: "false"
      - name: Lint the image tests
        run: |
          uvx ruff check packages/docker
          uvx ruff format --check packages/docker
      - name: Type check the image tests
        working-directory: packages/docker
        run: uv run --with pytest --with mypy mypy
      - name: Test the image
        run: uv run --with pytest pytest -c packages/docker/pytest.ini packages/docker/tests
        env:
          EXAMPLE_CLI_IMAGE: example-cli:test
      - name: Image size
        run: docker image ls example-cli:test --format '{{.Size}}'
