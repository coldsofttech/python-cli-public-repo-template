name: Security

# Static analysis (Semgrep). Findings are uploaded as SARIF, so they show up in the
# repository's Security tab (Code scanning) next to CodeQL, and the jobs fail when they find a problem.
# These jobs are not part of the required `ci` check, so a new rule does not block unrelated pull
# requests. The weekly run catches vulnerabilities published after a merge.
# Calls one workflow per package (security-core, security-cli, security-docker) and one for the rest
# of the repository (security-repo). On pull requests,
# `changes` limits the run to the parts of the repository the change can affect; pushes to main,
# the weekly run and manual runs scan everything.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/security-core.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/security-cli.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/security-docker.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  repo:
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    uses: ./.github/workflows/security-repo.yml
    permissions:
      contents: read
      security-events: write
      actions: read
