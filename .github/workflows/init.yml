name: Init

# Run once from the Actions tab in a repository created from the template.
# Replaces the template's owner and repository name, then opens a pull request.
on:
  workflow_dispatch:
    inputs:
      pyd_support:
        description: >-
          Ship compiled extension modules (.pyd on Windows, .so elsewhere) instead of plain .py
          sources. Releases then publish platform wheels only, with no sdist.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  init:
    if: github.repository != 'coldsofttech/python-cli-public-repo-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Replace placeholders
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          git ls-files -z -- . \
            ':(exclude).github/workflows' ':(exclude)LICENSE' ':(exclude).pre-commit-config.yaml' \
            | xargs -0 grep -lZ -e coldsofttech -e public-repo-template \
            | xargs -0 -r sed -i \
                -e "s|coldsofttech/python-cli-public-repo-template|$REPO|g" \
                -e "s|python-cli-public-repo-template|$NAME|g" \
                -e "s|coldsofttech|$OWNER|g"

      - name: Enable compiled (.pyd) builds
        if: inputs.pyd_support
        run: |
          cat > setup.py <<'PY'
          """Build script. With PYD_BUILD=1 every module except __init__.py and __main__.py is
          compiled with Cython into an extension module (.pyd on Windows, .so elsewhere), its .py
          source is left out of the wheel, and .pyi type stubs generated by mypy's stubgen ship in
          its place. Without it the package builds as plain Python, so local development, editable
          installs and coverage are unaffected.
          """

          import os
          import shutil
          from pathlib import Path

          from setuptools import Extension, setup
          from setuptools.command.build_py import build_py as _build_py

          COMPILE = os.environ.get("PYD_BUILD") == "1"
          SRC = Path("src")
          # Stay plain Python: packages need __init__.py, and python -m needs a source __main__.py.
          KEEP = {"__init__.py", "__main__.py"}


          class build_py(_build_py):
              def build_module(self, module, module_file, package):
                  if COMPILE and Path(module_file).name not in KEEP:
                      return None  # shipped as a compiled module instead
                  return super().build_module(module, module_file, package)

              def run(self):
                  super().run()
                  if COMPILE:
                      stubs = Path("build/stubs")
                      shutil.rmtree(stubs, ignore_errors=True)
                      from mypy.stubgen import main as stubgen

                      stubgen(["-o", str(stubs), str(SRC)])
                      shutil.copytree(stubs, self.build_lib, dirs_exist_ok=True)


          ext_modules = []
          if COMPILE:
              from Cython.Build import cythonize

              ext_modules = cythonize(
                  [
                      Extension(".".join(path.relative_to(SRC).with_suffix("").parts), [path.as_posix()])
                      for path in sorted(SRC.rglob("*.py"))
                      if path.name not in KEEP
                  ],
                  build_dir="build/cython",
                  compiler_directives={
                      "language_level": "3",
                      "annotation_typing": False,  # keep Python's runtime annotation semantics
                      "emit_code_comments": False,
                  },
              )

          setup(ext_modules=ext_modules, cmdclass={"build_py": build_py})
          PY

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          hatch = re.search(
              r'\[tool\.hatch\.version\]\npath = "src/(\w+)/__init__\.py"\n\n'
              r'\[tool\.hatch\.build\.targets\.wheel\]\npackages = \[[^\]]*\]\n',
              text,
          )
          assert hatch, "hatch version/wheel settings not found in pyproject.toml"
          package = hatch.group(1)

          def swap(old, new):
              global text
              assert old in text, old
              text = text.replace(old, new, 1)

          swap('requires = ["hatchling"]', 'requires = ["setuptools>=77", "Cython>=3.1", "mypy>=1.13"]')
          swap('build-backend = "hatchling.build"', 'build-backend = "setuptools.build_meta"')
          swap(
              hatch.group(0),
              f'[tool.setuptools.dynamic]\nversion = {{ attr = "{package}.__version__" }}\n\n'
              '[tool.setuptools.packages.find]\nwhere = ["src"]\n\n'
              '[tool.setuptools.package-data]\n"*" = ["py.typed"]\n\n'
              '[tool.cibuildwheel]\n'
              'build = "cp311-* cp312-* cp313-* cp314-*"\n'
              'environment = { PYD_BUILD = "1" }\n'
              'test-requires = "pytest"\n'
              'test-command = "pytest -o addopts= {project}/tests"\n',
          )
          path.write_text(text)
          PY

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/init-template
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git commit -m "chore: initialize repository from template"
          git push origin chore/init-template
          gh pr create --base "$BASE" --head chore/init-template \
            --title "chore: initialize repository from template" \
            --body "Replaces the template owner and repository name. Review, merge, then delete \`.github/workflows/init.yml\`."
