name: Release Docker

# Tag docker-vX.Y.Z: builds the command line image (packages/docker/Dockerfile) for linux/amd64 and
# linux/arm64 and pushes it to GHCR, as ghcr.io/<owner>/<repository> (lowercase) tagged X.Y.Z, and
# latest unless the release is a pre-release. Pushing waits for the approval of the `docker`
# environment. Then moves the docker-latest pointer. Called by release.yml.
on:
  workflow_call:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker-publish:
    name: docker publish (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: docker
    permissions:
      contents: write # move the docker-latest pointer
      packages: write # push the image to GHCR
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="${IMAGE,,}"
          version="${TAG#docker-v}"
          tags="$image:$version"
          if [ "$PRERELEASE" != "true" ]; then tags="$tags,$image:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update the latest markers
        uses: ./.github/actions/update-latest
        with:
          package: docker
