name: Release CLI

# Tag cli-vX.Y.Z: builds the command line (example-cli). Publishing the package to PyPI and attaching the files to the GitHub
# release happen in release.yml, because PyPI does not support trusted publishing from a reusable
# workflow. Release core first: example-cli depends on the example-package package on PyPI. Called by
# release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cli-build:
    name: cli build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Check the tag
        uses: ./.github/actions/check-release-tag
        with:
          package: example-cli
          prefix: cli-v
      - name: Build the package
        run: uv build --package example-cli
      - name: Check the package metadata
        run: uvx twine check --strict dist/*
      - name: Upload the distribution files
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
