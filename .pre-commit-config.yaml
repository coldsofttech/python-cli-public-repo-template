# Generated by Typer; CI checks it is up to date.
exclude: ^packages/cli/docs/cli-reference\.md$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/coldsofttech/Sweepito
    rev: v0.1.0
    hooks:
      - id: sweepito-scan
      - id: sweepito-clean
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        alias: ruff-check-core
        name: ruff check (core)
        args: [--fix]
        files: ^packages/core/
      - id: ruff-format
        alias: ruff-format-core
        name: ruff format (core)
        files: ^packages/core/
      - id: ruff-check
        alias: ruff-check-cli
        name: ruff check (cli)
        args: [--fix]
        files: ^packages/cli/
      - id: ruff-format
        alias: ruff-format-cli
        name: ruff format (cli)
        files: ^packages/cli/
      - id: ruff-check
        alias: ruff-check-repo
        name: ruff check (repo)
        args: [--fix]
        files: ^(?!packages/)
      - id: ruff-format
        alias: ruff-format-repo
        name: ruff format (repo)
        files: ^(?!packages/)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: mypy-core
        name: mypy (core)
        entry: uv run mypy packages/core/src
        language: system
        files: ^packages/core/.*\.py$
        pass_filenames: false
      - id: mypy-cli
        name: mypy (cli)
        entry: uv run mypy packages/cli/src
        language: system
        files: ^packages/cli/.*\.py$
        pass_filenames: false
      - id: pytest-core
        name: pytest (core)
        entry: uv run pytest -c packages/core/pyproject.toml packages/core/tests -n auto
        language: system
        files: ^packages/core/.*\.py$
        pass_filenames: false
      - id: pytest-cli
        name: pytest (cli)
        entry: uv run pytest -c packages/cli/pyproject.toml packages/cli/tests -n auto
        language: system
        files: ^packages/cli/.*\.py$
        pass_filenames: false
